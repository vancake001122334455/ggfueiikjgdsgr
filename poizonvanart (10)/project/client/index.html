<!-- Поддержка Telegram WebApp (Mini App, не блокирует загрузку) -->
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>

<!-- Тема применяется ДО загрузки CSS/JS — без "белой вспышки" -->
<script>
  (function () {
    try {
      localStorage.setItem('pv_theme', 'dark');
      document.documentElement.setAttribute('data-theme', 'dark');
      var c = localStorage.getItem('pv_currency') || 'RUB';
      document.documentElement.setAttribute('data-currency', c);
    } catch (e) {}
  })();
</script>

<link rel="stylesheet" href="/css/tokens.css?v=3.0">
<link rel="stylesheet" href="/css/app.css?v=3.0">

<!-- Общий код ядра (core/*.js) используется и сервером, и браузером -->
<script type="importmap">
{
  "imports": {
    "@core/": "/core/"
  }
}
</script>
</head>
<body>
  <div id="pv-preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0c11; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
